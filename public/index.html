<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tuga WiFi — Buy a Voucher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1F2A;
    --panel:#123240;
    --panel-2:#17415470;
    --amber:#F5A623;
    --amber-dim:#c9860f;
    --mint:#35D2A0;
    --paper:#FBF6EC;
    --paper-dim:#EFE6D2;
    --danger:#E4573D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #16465c 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #0f3040 0%, transparent 55%),
      var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{width:100%; max-width:440px;}
  .eyebrow{
    font-family:'Sora', sans-serif;
    font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--mint); margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 10px var(--mint); }
  h1{
    font-family:'Sora', sans-serif; font-weight:800; font-size:34px; line-height:1.08;
    margin:0 0 8px; letter-spacing:-.01em;
  }
  .sub{ color:#B9CBD3; font-size:15px; line-height:1.5; margin:0 0 26px; }

  .bars{ display:flex; align-items:flex-end; gap:5px; height:34px; margin:2px 0 26px; }
  .bars i{ display:block; width:8px; border-radius:3px 3px 0 0; background:linear-gradient(180deg,var(--amber),var(--amber-dim)); opacity:.35; transform-origin:bottom; }
  .bars i:nth-child(1){ height:10px; }
  .bars i:nth-child(2){ height:18px; }
  .bars i:nth-child(3){ height:26px; }
  .bars i:nth-child(4){ height:34px; }
  .bars.live i{ opacity:1; animation:pulse 1.6s ease-in-out infinite; }
  .bars.live i:nth-child(2){ animation-delay:.12s; }
  .bars.live i:nth-child(3){ animation-delay:.24s; }
  .bars.live i:nth-child(4){ animation-delay:.36s; }
  @keyframes pulse{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(.55); } }

  .card{
    background:var(--panel);
    border:1px solid #23566d;
    border-radius:18px;
    padding:26px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  }
  .price-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .price{ font-family:'Sora', sans-serif; font-weight:700; font-size:30px; }
  .price small{ font-size:14px; font-weight:500; color:#9DB4BE; }
  .stock{ font-size:13px; color:#8FE3C3; margin-bottom:20px; }
  .stock.low{ color:var(--amber); }
  .stock.out{ color:var(--danger); }

  label{ display:block; font-size:13px; color:#B9CBD3; margin-bottom:6px; font-weight:500; }
  input[type=email]{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid #2B5A70;
    background:#0E2A38; color:var(--paper); font-size:15px; font-family:'Inter',sans-serif;
    margin-bottom:16px; outline:none;
  }
  input[type=email]:focus{ border-color:var(--mint); }

  button.buy{
    width:100%; padding:15px; border:none; border-radius:12px; cursor:pointer;
    background:var(--amber); color:#1a1305; font-family:'Sora',sans-serif; font-weight:700; font-size:16px;
    transition:transform .12s ease, background .2s ease;
  }
  button.buy:hover:not(:disabled){ transform:translateY(-1px); background:#ffb436; }
  button.buy:disabled{ opacity:.5; cursor:not-allowed; }

  .msg{ margin-top:14px; font-size:13.5px; line-height:1.5; }
  .msg.error{ color:#FF9686; }
  .msg.info{ color:#9DB4BE; }

  .ticket{ display:none; }
  .ticket.show{ display:block; }
  .ticket-card{
    background:var(--paper); color:var(--ink); border-radius:16px; padding:26px 22px;
    position:relative; margin-top:6px; text-align:center;
    background-image:radial-gradient(circle at 0 50%, transparent 9px, var(--paper) 9.5px),
                      radial-gradient(circle at 100% 50%, transparent 9px, var(--paper) 9.5px);
  }
  .ticket-card::before{
    content:''; position:absolute; top:50%; left:22px; right:22px; border-top:2px dashed #D8CBAA;
  }
  .ticket-label{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8A7C58; font-weight:600; margin-bottom:10px; }
  .code{
    font-family:'Sora', sans-serif; font-weight:800; font-size:26px; letter-spacing:.06em;
    padding:16px 6px 22px; word-break:break-all;
  }
  .copy-btn{
    margin-top:6px; background:var(--ink); color:var(--paper); border:none; border-radius:9px;
    padding:10px 16px; font-family:'Sora',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .hint{ font-size:12.5px; color:#8A7C58; margin-top:14px; }

  footer{ text-align:center; margin-top:22px; font-size:12px; color:#5F7C87; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow">Instant delivery</div>
  <h1 id="title">Tuga WiFi</h1>
  <p class="sub" id="subtitle">Pay once, get your access code straight away — no waiting, no messages.</p>

  <div class="bars" id="bars"><i></i><i></i><i></i><i></i></div>

  <div class="card">
    <div id="buyView">
      <div class="price-row">
        <div class="price" id="priceText">—</div>
      </div>
      <div class="stock" id="stockText">Checking stock…</div>

      <label for="email">Your email (for the receipt)</label>
      <input type="email" id="email" placeholder="you@example.com" />

      <button class="buy" id="buyBtn" disabled>Loading…</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="ticket" id="ticketView">
      <div class="ticket-card">
        <div class="ticket-label">Your voucher code</div>
        <div class="code" id="codeText">—</div>
        <button class="copy-btn" id="copyBtn">Copy code</button>
      </div>
      <div class="hint">Enter this code on the WiFi login page to get connected. Keep it safe — it only works once.</div>
    </div>
  </div>

  <footer>Secured by Paystack</footer>
</div>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
  const buyBtn = document.getElementById('buyBtn');
  const emailInput = document.getElementById('email');
  const msg = document.getElementById('msg');
  const priceText = document.getElementById('priceText');
  const stockText = document.getElementById('stockText');
  const bars = document.getElementById('bars');
  const buyView = document.getElementById('buyView');
  const ticketView = document.getElementById('ticketView');
  const codeText = document.getElementById('codeText');
  const copyBtn = document.getElementById('copyBtn');

  const PAYSTACK_PUBLIC_KEY = "pk_live_0adba346fb64f2e371699f37626298dc6ada4b29";

  let status = null;

  function showMsg(text, type){
    msg.textContent = text || '';
    msg.className = 'msg' + (type ? ' ' + type : '');
  }

  async function loadStatus(){
    try{
      const res = await fetch('/.netlify/functions/get-status');
      const data = await res.json();
      if(!res.ok){
        stockText.textContent = data.error || 'Store setup issue — check Netlify function logs.';
        stockText.className = 'stock out';
        buyBtn.disabled = true;
        return;
      }
      status = data;
      document.title = status.businessName + ' — Buy a Voucher';
      document.getElementById('title').textContent = status.businessName;
      priceText.innerHTML = formatPrice(status.price, status.currency) + ' <small>/ voucher</small>';
      if(status.inStock <= 0){
        stockText.textContent = 'Sold out right now — check back soon.';
        stockText.className = 'stock out';
        buyBtn.textContent = 'Sold out';
        buyBtn.disabled = true;
      } else if(status.inStock <= 5){
        stockText.textContent = `Only ${status.inStock} code${status.inStock===1?'':'s'} left`;
        stockText.className = 'stock low';
        buyBtn.textContent = 'Buy voucher';
        buyBtn.disabled = false;
      } else {
        stockText.textContent = `${status.inStock} codes available`;
        stockText.className = 'stock';
        buyBtn.textContent = 'Buy voucher';
        buyBtn.disabled = false;
      }
    }catch(e){
      stockText.textContent = 'Could not load the store. Refresh to try again.';
      stockText.className = 'stock out';
      buyBtn.disabled = true;
    }
  }

  function formatPrice(amount, currency){
    try{
      return new Intl.NumberFormat('en-GH', { style:'currency', currency: currency || 'GHS' }).format(amount);
    }catch(e){
      return `${currency} ${amount}`;
    }
  }

  function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  buyBtn.addEventListener('click', () => {
    const email = emailInput.value.trim();
    if(!isValidEmail(email)){
      showMsg('Enter a valid email first.', 'error');
      emailInput.focus();
      return;
    }
    if(!status || status.inStock <= 0){
      showMsg('Sold out right now.', 'error');
      return;
    }
    showMsg('', '');
    const reference = 'tuga_' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
    const handler = PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email,
      amount: Math.round(status.price * 100),
      currency: status.currency,
      ref: reference,
      callback: function(response){
        confirmPurchase(response.reference);
      },
      onClose: function(){
        showMsg('Payment cancelled.', 'info');
      }
    });
    handler.openIframe();
  });

  async function confirmPurchase(reference){
    buyBtn.disabled = true;
    buyBtn.textContent = 'Confirming payment…';
    bars.classList.add('live');
    showMsg('Confirming your payment, one moment…', 'info');
    try{
      const res = await fetch('/.netlify/functions/verify-payment', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ reference })
      });
      const data = await res.json();
      bars.classList.remove('live');
      if(!res.ok){
        showMsg(data.error || 'Something went wrong confirming your payment.', 'error');
        buyBtn.disabled = false;
        buyBtn.textContent = 'Buy voucher';
        return;
      }
      codeText.textContent = data.code;
      buyView.style.display = 'none';
      ticketView.classList.add('show');
      loadStatus();
    }catch(e){
      bars.classList.remove('live');
      showMsg('Network error confirming payment. If you were charged, contact support with your email.', 'error');
      buyBtn.disabled = false;
      buyBtn.textContent = 'Buy voucher';
    }
  }

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(codeText.textContent).then(() => {
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy code', 1500);
    });
  });

  loadStatus();
</script>
</body>
</html>
